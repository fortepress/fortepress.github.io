<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Szórólap Megrendelés - Foxpost Átvétel</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .btn { background: #28a745; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h2>🛒 Szórólap Megrendelés</h2>
  
  <form id="order-form">
    <label for="db"><strong>Darabszám:</strong></label><br>
    <select id="db" style="padding: 8px; margin: 10px 0 20px 0; width: 100%;">
      <option value="50">50 db - A/5 szórólap</option>
      <option value="100">100 db - A/5 szórólap</option>
      <option value="250">250 db - A/5 szórólap</option>
      <option value="500">500 db - A/5 szórólap</option>
    </select>

    <h3>📍 Válassz Foxpost Csomagautomatát:</h3>
    <p id="automata-info" style="color: #28a745; font-weight: bold;">Még nincs automata kiválasztva.</p>
    <input type="hidden" id="selected-automata" name="selected_automata" required>

    <!-- TÉRKÉP CONTAINER A JAVÍTOTT URL-LEL -->
    <div style="width: 100%; height: 500px; border: 1px solid #ccc; border-radius: 8px; overflow: hidden;">
      <iframe src="https://cdn.foxpost.hu/apt-finder/v1/app/" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>

    <br><br>
    <button type="submit" class="btn">Megrendelés elküldése és fizetés</button>
  </form>
</div>

<script>
  window.addEventListener('message', function(event) {
    try {
      var data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      if (data && (data.place || data.name)) {
        var placeName = data.place ? data.place.name : data.name;
        var placeAddr = data.place ? data.place.address : data.address;
        
        document.getElementById('selected-automata').value = placeName + " (" + placeAddr + ")";
        document.getElementById('automata-info').innerText = "Kiválasztott automata: " + placeName + " - " + placeAddr;
      }
    } catch(e) {
      // Egyéb nem-JSON üzenetek kiszűrése
    }
  });
</script>

</body>
</html>
